<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get & Post</title>
  </head>
  <body>
    <h3>Get Request Form</h3>
    <form method="get" action="http://localhost:3000/register">
      <input type="text" placeholder="Enter Your Name "  name="name"/>
      <input type="text" placeholder="Enter your Password " />
      <button>Submit</button>
    </form>
    <h3>post Request Form</h3>
    <form method="post" action="http://localhost:3000/register">
      <input type="text" placeholder="Enter Your Name " name="user"/>
      <input type="text" placeholder="Enter your Password "  name="Pass"/>
      <button>Submit</button>
    </form>
  </body>
</html>
